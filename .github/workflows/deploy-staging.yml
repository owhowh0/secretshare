name: Deploy Staging

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via Tailscale SSH
        run: |
          tailscale ssh root@staging-server << 'EOF'
            set -euo pipefail
            REPO_DIR="/opt/secretshare"

            echo "=== Pulling latest changes on branch ==="
            cd "${REPO_DIR}"
            git fetch origin
            git checkout main || git checkout develop
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            echo "=== Ensuring shared traefik network ==="
            docker network inspect traefik-net >/dev/null 2>&1 || docker network create traefik-net

            echo "=== Rebuilding and updating staging stack ==="
            docker compose -p staging -f docker-compose.yml up -d --build --remove-orphans
          EOF
