name: Test TLS

on:
  push:
    branches:
      - main
      - develop
      - feat/**
  pull_request:

jobs:
  test:
    name: Run TLS tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest tests/test_tls.py -q --strict-markers \
            --junitxml=test-results/tls-junit.xml \
            --cov=app \
            --cov-report=xml:test-results/tls-coverage.xml \
            --cov-report=term

      - name: Publish TLS Test Summary
        if: always()
        run: |
          python ../.github/scripts/report_summary.py "TLS Tests" test-results/tls-junit.xml test-results/tls-coverage.xml >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload TLS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-test-results
          path: api/test-results/
