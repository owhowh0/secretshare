name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Ephemeral Preview
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy Preview Stack via Tailscale SSH
        id: deploy
        env:
          PR_NUM: ${{ github.event.number }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          TAILNET_NAME=$(tailscale status --json 2>/dev/null | jq -r '.MagicDNSSuffix // .CurrentTailnet.MagicDNSSuffix // empty' || true)
          if [ -z "${TAILNET_NAME}" ]; then
            TAILNET_NAME=$(tailscale status 2>/dev/null | grep -oE '[a-zA-Z0-9.-]+\.ts\.net' | head -n1 | sed -E 's/^[a-zA-Z0-9_-]+\.//' || true)
          fi
          if [ -z "${TAILNET_NAME}" ]; then
            TAILNET_NAME="ts.net"
          fi
          PR_HOSTNAME="pr-${PR_NUM}.${TAILNET_NAME}"
          PREVIEW_URL="https://${PR_HOSTNAME}"

          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "pr_hostname=${PR_HOSTNAME}" >> "$GITHUB_OUTPUT"

          tailscale ssh root@staging-server "PR_HOSTNAME='${PR_HOSTNAME}' TS_AUTHKEY='${TS_AUTHKEY}' bash -s" << 'EOF'
            set -euxo pipefail
            trap 'echo "!!! DEPLOYMENT FAILED AT LINE ${LINENO} (exit code: $?) !!!"' ERR
            PR_NUM="${{ github.event.number }}"
            REPO_DIR="/opt/secretshare"
            WORKTREE_DIR="${REPO_DIR}/worktrees/pr-${PR_NUM}"
            PR_HOSTNAME="${PR_HOSTNAME}"
            PREVIEW_URL="https://${PR_HOSTNAME}"

            echo "=== Ensuring base traefik router exists ==="
            docker network inspect traefik-net >/dev/null 2>&1 || docker network create traefik-net
            if [ -z "$(docker ps -q -f name=^traefik$)" ]; then
              docker run -d \
                --name traefik \
                --restart unless-stopped \
                -p 80:80 \
                -p 8080:8080 \
                -v /var/run/docker.sock:/var/run/docker.sock:ro \
                --network traefik-net \
                traefik:latest \
                --api.insecure=true \
                --providers.docker=true \
                --providers.docker.exposedbydefault=false \
                --providers.docker.network=traefik-net \
                --entrypoints.web.address=:80
            fi

            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo "=== Initializing repository in ${REPO_DIR} ==="
              rm -rf "${REPO_DIR}"
              git clone "https://github.com/${{ github.repository }}.git" "${REPO_DIR}"
            fi

            echo "=== Syncing PR branch to worktree ==="
            if [ -d "${WORKTREE_DIR}" ]; then
              cd "${WORKTREE_DIR}"
              git fetch origin "pull/${PR_NUM}/head"
              git reset --hard FETCH_HEAD
            else
              cd "${REPO_DIR}"
              git fetch origin "pull/${PR_NUM}/head"
              git worktree add -f --detach "${WORKTREE_DIR}" FETCH_HEAD
            fi

            echo "=== Preparing isolated stack environment ==="
            cd "${WORKTREE_DIR}"
            if [ -f .env ]; then
              PR_SECRET=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- || true)
              KC_SECRET=$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2- || true)
              AUTH_SEC=$(grep '^AUTH_SECRET=' .env | cut -d= -f2- || true)
            fi
            PR_SECRET="${PR_SECRET:-$(openssl rand -hex 16)}"
            KC_SECRET="${KC_SECRET:-$(openssl rand -hex 16)}"
            AUTH_SEC="${AUTH_SEC:-$(openssl rand -hex 32)}"

            # Resolve TS_AUTHKEY: prefer environment secret, fallback to host master .env
            set +x
            if [ -n "${TS_AUTHKEY:-}" ]; then
              AUTH_KEY="${TS_AUTHKEY}"
            elif [ -f "${REPO_DIR}/.env" ]; then
              AUTH_KEY=$(grep '^TS_AUTHKEY=' "${REPO_DIR}/.env" | cut -d= -f2- || true)
            else
              AUTH_KEY=""
            fi

            export PR_NUMBER="${PR_NUM}"
            export POSTGRES_PASSWORD="${PR_SECRET}"
            export KEYCLOAK_ADMIN_PASSWORD="${KC_SECRET}"
            export AUTH_SECRET="${AUTH_SEC}"
            export TS_AUTHKEY="${AUTH_KEY}"
            export PR_HOSTNAME="${PR_HOSTNAME}"
            printf "PR_NUMBER=%s\nPOSTGRES_PASSWORD=%s\nKEYCLOAK_ADMIN_PASSWORD=%s\nAUTH_SECRET=%s\nTS_AUTHKEY=%s\nPR_HOSTNAME=%s\n" \
              "${PR_NUM}" "${PR_SECRET}" "${KC_SECRET}" "${AUTH_SEC}" "${AUTH_KEY}" "${PR_HOSTNAME}" > .env
            set -x

            # Write Tailscale serve configuration for this PR hostname
            mkdir -p "${WORKTREE_DIR}/tailscale"
            cat <<SERVE_EOF > "${WORKTREE_DIR}/tailscale/serve.json"
{
  "TCP": {
    "443": {
      "HTTPS": true
    }
  },
  "Web": {
    "${PR_HOSTNAME}:443": {
      "Handlers": {
        "/": {
          "Proxy": "http://traefik:80"
        }
      }
    }
  }
}
SERVE_EOF

            echo "=== Building & launching isolated stack ==="
            if ! docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml up -d --build --remove-orphans; then
              echo "=== Initial compose up failed, resetting stale volumes and retrying... ==="
              docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml down -v --remove-orphans || true
              docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml up -d --build --remove-orphans
            fi

            echo "=== Verifying preview deployment health & routing at ${PREVIEW_URL} ==="
            bash "${WORKTREE_DIR}/.github/scripts/wait_services_ready.sh" "${PREVIEW_URL}" "pr-${PR_NUM}" "docker-compose.preview.yml"

            echo "=== Running Preview E2E Test Suite ==="
            bash "${WORKTREE_DIR}/.github/scripts/test_web_routing.sh" "${PREVIEW_URL}" false
            bash "${WORKTREE_DIR}/.github/scripts/test_api_docs.sh" "${PREVIEW_URL}"
            bash "${WORKTREE_DIR}/.github/scripts/test_auth_keycloak.sh" "${PREVIEW_URL}" "${WORKTREE_DIR}/.token_tmp"
            bash "${WORKTREE_DIR}/.github/scripts/test_secret_lifecycle.sh" "${PREVIEW_URL}" "${WORKTREE_DIR}/.token_tmp"
            rm -f "${WORKTREE_DIR}/.token_tmp"

            echo "=== Preview deployment and all verification tests passed successfully! ==="
          EOF

      - name: Publish Preview Summary to Pipeline
        if: success()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          PR_HOSTNAME: ${{ steps.deploy.outputs.pr_hostname }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🚀 Ephemeral Preview Deployed

          | Service | Direct Link |
          | :--- | :--- |
          | **Web Application** | [${PREVIEW_URL}](${PREVIEW_URL}) |
          | **Swagger API Docs** | [${PREVIEW_URL}/api/docs](${PREVIEW_URL}/api/docs) |
          | **API Health Status** | [${PREVIEW_URL}/api/health](${PREVIEW_URL}/api/health) |
          | **Keycloak Admin Console** | [${PREVIEW_URL}/keycloak](${PREVIEW_URL}/keycloak) |

          **OAuth Test Credentials**: \`testuser\` / \`testpassword123\` (Realm: \`secretshare\`, Client: \`secretshare-api\`)  
          🔒 *Secured with Tailscale & Valid Let's Encrypt HTTPS (WebAuthn & Passkeys Enabled)*
          EOF

          echo "================================================================================"
          echo "  🚀 PREVIEW ENVIRONMENT URL: ${PREVIEW_URL}"
          echo "  📖 API SWAGGER DOCS:        ${PREVIEW_URL}/api/docs"
          echo "  🔑 KEYCLOAK ADMIN CONSOLE:  ${PREVIEW_URL}/keycloak"
          echo "================================================================================"

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = process.env.PREVIEW_URL;
            const webUrl = `${previewUrl}`;
            const apiDocsUrl = `${previewUrl}/api/docs`;
            const healthUrl = `${previewUrl}/api/health`;
            const keycloakUrl = `${previewUrl}/keycloak`;
            const commentIdentifier = "<!-- preview-deployment-comment -->";
            const body = [
              commentIdentifier,
              "### 🚀 Preview Environment Ready (HTTPS & Subdomain)",
              "",
              `- **Web App**: [${webUrl}](${webUrl})`,
              `- **API Docs / Swagger**: [${apiDocsUrl}](${apiDocsUrl})`,
              `- **Health Check**: \`${healthUrl}\``,
              `- **Keycloak Admin Console**: [${keycloakUrl}](${keycloakUrl}) — user: \`admin\``,
              `- **OAuth Test User**: \`testuser\` / \`testpassword123\` (Realm: \`secretshare\`, Client: \`secretshare-api\`)`,
              "",
              "> *Secured with Tailscale & Valid Let's Encrypt HTTPS (WebAuthn Passkeys Supported).* ",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body.includes(commentIdentifier));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

  cleanup-preview:
    name: Teardown Preview Stack
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Teardown Preview Stack via Tailscale SSH
        run: |
          tailscale ssh root@staging-server << 'EOF'
            PR_NUM="${{ github.event.number }}"
            REPO_DIR="/opt/secretshare"
            WORKTREE_DIR="${REPO_DIR}/worktrees/pr-${PR_NUM}"

            echo "=== Tearing down PR ${PR_NUM} stack and volumes ==="
            if [ -d "${WORKTREE_DIR}" ]; then
              PR_NUMBER="${PR_NUM}" docker compose -p "pr-${PR_NUM}" -f "${WORKTREE_DIR}/docker-compose.preview.yml" down -v --remove-orphans || true
              cd "${REPO_DIR}"
              git worktree remove --force "${WORKTREE_DIR}" || true
              git branch -D "pr-${PR_NUM}" || true
            else
              docker compose -p "pr-${PR_NUM}" down -v || true
            fi
          EOF
