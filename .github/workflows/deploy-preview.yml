name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Ephemeral Preview
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy Preview Stack via Tailscale SSH
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          tailscale ssh root@staging-server "bash -s" << 'EOF'
            set -euxo pipefail
            PR_NUM="${{ github.event.number }}"
            REPO_DIR="/opt/secretshare"
            WORKTREE_DIR="${REPO_DIR}/worktrees/pr-${PR_NUM}"

            echo "=== Ensuring base traefik router exists ==="
            docker network inspect traefik-net >/dev/null 2>&1 || docker network create traefik-net
            if [ -z "$(docker ps -q -f name=^traefik$)" ]; then
              docker run -d \
                --name traefik \
                --restart unless-stopped \
                -p 80:80 \
                -p 8080:8080 \
                -v /var/run/docker.sock:/var/run/docker.sock:ro \
                --network traefik-net \
                traefik:latest \
                --api.insecure=true \
                --providers.docker=true \
                --providers.docker.exposedbydefault=false \
                --providers.docker.network=traefik-net \
                --entrypoints.web.address=:80
            fi

            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo "=== Initializing repository in ${REPO_DIR} ==="
              rm -rf "${REPO_DIR}"
              git clone "https://github.com/${{ github.repository }}.git" "${REPO_DIR}"
            fi

            echo "=== Syncing PR branch to worktree ==="
            if [ -d "${WORKTREE_DIR}" ]; then
              cd "${WORKTREE_DIR}"
              git fetch origin "pull/${PR_NUM}/head"
              git reset --hard FETCH_HEAD
            else
              cd "${REPO_DIR}"
              git fetch origin "pull/${PR_NUM}/head"
              git worktree add -f --detach "${WORKTREE_DIR}" FETCH_HEAD
            fi

            echo "=== Preparing isolated stack environment ==="
            cd "${WORKTREE_DIR}"
            if [ -f .env ]; then
              PR_SECRET=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- || true)
              KC_SECRET=$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2- || true)
            fi
            PR_SECRET="${PR_SECRET:-$(openssl rand -hex 16)}"
            KC_SECRET="${KC_SECRET:-$(openssl rand -hex 16)}"
            export PR_NUMBER="${PR_NUM}"
            export POSTGRES_PASSWORD="${PR_SECRET}"
            export KEYCLOAK_ADMIN_PASSWORD="${KC_SECRET}"
            printf "PR_NUMBER=%s\nPOSTGRES_PASSWORD=%s\nKEYCLOAK_ADMIN_PASSWORD=%s\n" "${PR_NUM}" "${PR_SECRET}" "${KC_SECRET}" > .env

            echo "=== Building & launching isolated stack ==="
            if ! docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml up -d --build --remove-orphans; then
              echo "=== Initial compose up failed, resetting stale volumes and retrying... ==="
              docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml down -v --remove-orphans || true
              docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml up -d --build --remove-orphans
            fi

            echo "=== Verifying preview deployment health & routing ==="
            ATTEMPTS=0
            MAX_ATTEMPTS=30
            until curl -s -f -L -m 5 "http://127.0.0.1/pr-${PR_NUM}/" >/dev/null && \
                  curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/api/health" >/dev/null && \
                  curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/keycloak/realms/secretshare" >/dev/null; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                echo "=== Preview verification timed out after ${MAX_ATTEMPTS} attempts! Container status: ==="
                docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml ps
                echo "=== Container logs: ==="
                docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml logs --tail 50
                exit 1
              fi
              sleep 2
            done

            echo "=== 1. Testing trailing-slash redirect on /pr-${PR_NUM} ==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1/pr-${PR_NUM}")
            if [ "$HTTP_CODE" != "301" ] && [ "$HTTP_CODE" != "308" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "Error: Unexpected HTTP code $HTTP_CODE for /pr-${PR_NUM}"
              exit 1
            fi

            echo "=== 2. Testing Frontend HTML & Assets ==="
            HTML_OUTPUT=$(curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/")
            echo "$HTML_OUTPUT" | grep -q 'id="login-btn"' || { echo "Error: login-btn missing in HTML"; exit 1; }
            echo "$HTML_OUTPUT" | grep -q 'id="create-btn"' || { echo "Error: create-btn missing in HTML"; exit 1; }

            JS_OUTPUT=$(curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/app.js")
            echo "$JS_OUTPUT" | grep -q 'secretshare-api' || { echo "Error: app.js content invalid"; exit 1; }
            echo "$JS_OUTPUT" | grep -q 'sessionStorage' || { echo "Error: app.js missing session logic"; exit 1; }

            echo "=== 3. Testing API Swagger Docs & OpenAPI Schema ==="
            curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/api/docs" >/dev/null || { echo "Error: /api/docs failed"; exit 1; }
            curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/api/openapi.json" | grep -q '"/health"' || { echo "Error: /api/openapi.json invalid"; exit 1; }

            echo "=== 4. Testing Keycloak OIDC Discovery & Token Issuance ==="
            curl -s -f -m 5 "http://127.0.0.1/pr-${PR_NUM}/keycloak/realms/secretshare/.well-known/openid-configuration" | grep -q 'token_endpoint' || { echo "Error: OIDC discovery failed"; exit 1; }

            KC_TOKEN_RESPONSE=$(curl -s -f -m 10 -X POST "http://127.0.0.1/pr-${PR_NUM}/keycloak/realms/secretshare/protocol/openid-connect/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "client_id=secretshare-api&grant_type=password&username=testuser&password=testpassword123&scope=openid")

            ACCESS_TOKEN=$(echo "$KC_TOKEN_RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
            if [ -z "$ACCESS_TOKEN" ]; then
              echo "Error: Failed to obtain access_token from Keycloak: $KC_TOKEN_RESPONSE"
              exit 1
            fi

            echo "=== 5. Testing Protected /api/me Endpoint with Token ==="
            ME_RESPONSE=$(curl -s -f -m 10 "http://127.0.0.1/pr-${PR_NUM}/api/me" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}")
            echo "$ME_RESPONSE" | grep -q '"preferred_username":"testuser"' || { echo "Error: /api/me returned unexpected user: $ME_RESPONSE"; exit 1; }

            CODE_NO_AUTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1/pr-${PR_NUM}/api/me")
            [ "$CODE_NO_AUTH" = "403" ] || { echo "Error: Expected 403 for unauthenticated /api/me, got $CODE_NO_AUTH"; exit 1; }

            CODE_BAD_AUTH=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer invalid.token" "http://127.0.0.1/pr-${PR_NUM}/api/me")
            [ "$CODE_BAD_AUTH" = "401" ] || { echo "Error: Expected 401 for invalid token on /api/me, got $CODE_BAD_AUTH"; exit 1; }

            echo "=== 6. Testing Authenticated Secret Lifecycle ==="
            AUTH_PAYLOAD_ID=$(curl -s -f -m 10 -X POST "http://127.0.0.1/pr-${PR_NUM}/api/secrets" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -d '{"ciphertext": "authenticated-e2e-smoke-test"}' | grep -o '"payload_id":"[^"]*' | cut -d'"' -f4)

            if [ -z "${AUTH_PAYLOAD_ID}" ]; then
              echo "Error: Failed to create authenticated secret on deployed preview stack"
              exit 1
            fi

            AUTH_RETRIEVED=$(curl -s -f -m 10 "http://127.0.0.1/pr-${PR_NUM}/api/secrets/${AUTH_PAYLOAD_ID}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" | grep -o '"ciphertext":"[^"]*' | cut -d'"' -f4)
            if [ "${AUTH_RETRIEVED}" != "authenticated-e2e-smoke-test" ]; then
              echo "Error: Retrieved authenticated secret does not match expected payload"
              exit 1
            fi

            AUTH_BURN_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1/pr-${PR_NUM}/api/secrets/${AUTH_PAYLOAD_ID}")
            [ "$AUTH_BURN_CODE" = "404" ] || { echo "Error: Expected 404 on second retrieval (burn), got $AUTH_BURN_CODE"; exit 1; }

            echo "=== 7. Testing Anonymous Secret Lifecycle ==="
            PAYLOAD_ID=$(curl -s -f -m 10 -X POST "http://127.0.0.1/pr-${PR_NUM}/api/secrets" \
              -H "Content-Type: application/json" \
              -d '{"ciphertext": "anonymous-e2e-smoke-test"}' | grep -o '"payload_id":"[^"]*' | cut -d'"' -f4)

            if [ -z "${PAYLOAD_ID}" ]; then
              echo "Error: Failed to create anonymous secret on deployed preview stack"
              exit 1
            fi

            RETRIEVED=$(curl -s -f -m 10 "http://127.0.0.1/pr-${PR_NUM}/api/secrets/${PAYLOAD_ID}" | grep -o '"ciphertext":"[^"]*' | cut -d'"' -f4)
            if [ "${RETRIEVED}" != "anonymous-e2e-smoke-test" ]; then
              echo "Error: Retrieved secret does not match expected payload"
              exit 1
            fi

            BURN_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1/pr-${PR_NUM}/api/secrets/${PAYLOAD_ID}")
            [ "$BURN_CODE" = "404" ] || { echo "Error: Expected 404 on second retrieval (burn), got $BURN_CODE"; exit 1; }

            echo "=== Preview deployment and all verification tests passed successfully! ==="
          EOF

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const webUrl = `http://staging-server/pr-${prNumber}`;
            const apiDocsUrl = `http://staging-server/pr-${prNumber}/api/docs`;
            const healthUrl = `http://staging-server/pr-${prNumber}/api/health`;
            const keycloakUrl = `http://staging-server/pr-${prNumber}/keycloak`;
            const commentIdentifier = "<!-- preview-deployment-comment -->";
            const body = [
              commentIdentifier,
              "### 🚀 Preview Environment Ready",
              "",
              `- **Web App**: [${webUrl}](${webUrl})`,
              `- **API Docs / Swagger**: [${apiDocsUrl}](${apiDocsUrl})`,
              `- **Health Check**: \`${healthUrl}\``,
              `- **Keycloak Admin Console**: [${keycloakUrl}](${keycloakUrl}) — user: \`admin\``,
              `- **OAuth Test User**: \`testuser\` / \`testpassword123\` (Realm: \`secretshare\`, Client: \`secretshare-api\`)`,
              "",
              "> *Accessible to team members on Tailscale.*",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body.includes(commentIdentifier));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

  cleanup-preview:
    name: Teardown Preview Stack
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Teardown Preview Stack via Tailscale SSH
        run: |
          tailscale ssh root@staging-server << 'EOF'
            PR_NUM="${{ github.event.number }}"
            REPO_DIR="/opt/secretshare"
            WORKTREE_DIR="${REPO_DIR}/worktrees/pr-${PR_NUM}"

            echo "=== Tearing down PR ${PR_NUM} stack and volumes ==="
            if [ -d "${WORKTREE_DIR}" ]; then
              PR_NUMBER="${PR_NUM}" docker compose -p "pr-${PR_NUM}" -f "${WORKTREE_DIR}/docker-compose.preview.yml" down -v --remove-orphans || true
              cd "${REPO_DIR}"
              git worktree remove --force "${WORKTREE_DIR}" || true
              git branch -D "pr-${PR_NUM}" || true
            else
              docker compose -p "pr-${PR_NUM}" down -v || true
            fi
          EOF
