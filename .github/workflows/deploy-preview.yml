name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Ephemeral Preview
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy Preview Stack via Tailscale SSH
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          tailscale ssh root@staging-server "bash -s" << 'EOF'
            set -euxo pipefail
            trap 'echo "!!! DEPLOYMENT FAILED AT LINE ${LINENO} (exit code: $?) !!!"' ERR
            PR_NUM="${{ github.event.number }}"
            REPO_DIR="/opt/secretshare"
            WORKTREE_DIR="${REPO_DIR}/worktrees/pr-${PR_NUM}"

            echo "=== Ensuring base traefik router exists ==="
            docker network inspect traefik-net >/dev/null 2>&1 || docker network create traefik-net
            if [ -z "$(docker ps -q -f name=^traefik$)" ]; then
              docker run -d \
                --name traefik \
                --restart unless-stopped \
                -p 80:80 \
                -p 8080:8080 \
                -v /var/run/docker.sock:/var/run/docker.sock:ro \
                --network traefik-net \
                traefik:latest \
                --api.insecure=true \
                --providers.docker=true \
                --providers.docker.exposedbydefault=false \
                --providers.docker.network=traefik-net \
                --entrypoints.web.address=:80
            fi

            if [ ! -d "${REPO_DIR}/.git" ]; then
              echo "=== Initializing repository in ${REPO_DIR} ==="
              rm -rf "${REPO_DIR}"
              git clone "https://github.com/${{ github.repository }}.git" "${REPO_DIR}"
            fi

            echo "=== Syncing PR branch to worktree ==="
            if [ -d "${WORKTREE_DIR}" ]; then
              cd "${WORKTREE_DIR}"
              git fetch origin "pull/${PR_NUM}/head"
              git reset --hard FETCH_HEAD
            else
              cd "${REPO_DIR}"
              git fetch origin "pull/${PR_NUM}/head"
              git worktree add -f --detach "${WORKTREE_DIR}" FETCH_HEAD
            fi

            echo "=== Preparing isolated stack environment ==="
            cd "${WORKTREE_DIR}"
            if [ -f .env ]; then
              PR_SECRET=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2- || true)
              KC_SECRET=$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2- || true)
              AUTH_SEC=$(grep '^AUTH_SECRET=' .env | cut -d= -f2- || true)
            fi
            PR_SECRET="${PR_SECRET:-$(openssl rand -hex 16)}"
            KC_SECRET="${KC_SECRET:-$(openssl rand -hex 16)}"
            AUTH_SEC="${AUTH_SEC:-$(openssl rand -hex 32)}"
            export PR_NUMBER="${PR_NUM}"
            export POSTGRES_PASSWORD="${PR_SECRET}"
            export KEYCLOAK_ADMIN_PASSWORD="${KC_SECRET}"
            export AUTH_SECRET="${AUTH_SEC}"
            printf "PR_NUMBER=%s\nPOSTGRES_PASSWORD=%s\nKEYCLOAK_ADMIN_PASSWORD=%s\nAUTH_SECRET=%s\n" "${PR_NUM}" "${PR_SECRET}" "${KC_SECRET}" "${AUTH_SEC}" > .env

            echo "=== Building & launching isolated stack ==="
            if ! docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml up -d --build --remove-orphans; then
              echo "=== Initial compose up failed, resetting stale volumes and retrying... ==="
              docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml down -v --remove-orphans || true
              docker compose -p "pr-${PR_NUM}" -f docker-compose.preview.yml up -d --build --remove-orphans
            fi

            echo "=== Verifying preview deployment health & routing ==="
            bash "${WORKTREE_DIR}/.github/scripts/wait_services_ready.sh" "http://127.0.0.1/pr-${PR_NUM}" "pr-${PR_NUM}" "docker-compose.preview.yml"

            echo "=== Running Preview E2E Test Suite ==="
            bash "${WORKTREE_DIR}/.github/scripts/test_web_routing.sh" "http://127.0.0.1/pr-${PR_NUM}" true
            bash "${WORKTREE_DIR}/.github/scripts/test_api_docs.sh" "http://127.0.0.1/pr-${PR_NUM}"
            bash "${WORKTREE_DIR}/.github/scripts/test_auth_keycloak.sh" "http://127.0.0.1/pr-${PR_NUM}" "${WORKTREE_DIR}/.token_tmp"
            bash "${WORKTREE_DIR}/.github/scripts/test_secret_lifecycle.sh" "http://127.0.0.1/pr-${PR_NUM}" "${WORKTREE_DIR}/.token_tmp"
            rm -f "${WORKTREE_DIR}/.token_tmp"

            echo "=== Preview deployment and all verification tests passed successfully! ==="
          EOF

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const webUrl = `http://staging-server/pr-${prNumber}`;
            const apiDocsUrl = `http://staging-server/pr-${prNumber}/api/docs`;
            const healthUrl = `http://staging-server/pr-${prNumber}/api/health`;
            const keycloakUrl = `http://staging-server/pr-${prNumber}/keycloak`;
            const commentIdentifier = "<!-- preview-deployment-comment -->";
            const body = [
              commentIdentifier,
              "### 🚀 Preview Environment Ready",
              "",
              `- **Web App**: [${webUrl}](${webUrl})`,
              `- **API Docs / Swagger**: [${apiDocsUrl}](${apiDocsUrl})`,
              `- **Health Check**: \`${healthUrl}\``,
              `- **Keycloak Admin Console**: [${keycloakUrl}](${keycloakUrl}) — user: \`admin\``,
              `- **OAuth Test User**: \`testuser\` / \`testpassword123\` (Realm: \`secretshare\`, Client: \`secretshare-api\`)`,
              "",
              "> *Accessible to team members on Tailscale.*",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body.includes(commentIdentifier));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

  cleanup-preview:
    name: Teardown Preview Stack
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Teardown Preview Stack via Tailscale SSH
        run: |
          tailscale ssh root@staging-server << 'EOF'
            PR_NUM="${{ github.event.number }}"
            REPO_DIR="/opt/secretshare"
            WORKTREE_DIR="${REPO_DIR}/worktrees/pr-${PR_NUM}"

            echo "=== Tearing down PR ${PR_NUM} stack and volumes ==="
            if [ -d "${WORKTREE_DIR}" ]; then
              PR_NUMBER="${PR_NUM}" docker compose -p "pr-${PR_NUM}" -f "${WORKTREE_DIR}/docker-compose.preview.yml" down -v --remove-orphans || true
              cd "${REPO_DIR}"
              git worktree remove --force "${WORKTREE_DIR}" || true
              git branch -D "pr-${PR_NUM}" || true
            else
              docker compose -p "pr-${PR_NUM}" down -v || true
            fi
          EOF
