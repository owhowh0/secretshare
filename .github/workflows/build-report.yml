name: Build and Deploy LaTeX Report

on:
  push:
    branches:
      - 'report'
      - 'report/**'
      - 'report-*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: report.tex

      - name: Prepare site structure
        run: |
          mkdir site
          cp report/report.pdf site/
          cat << 'EOF' > site/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Report Preview</title>
            <style>
              body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
              iframe { width: 100%; height: 100%; border: none; }
            </style>
          </head>
          <body>
            <iframe src="report.pdf"></iframe>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Upload PDF as standard artifact (for all branches)
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: site/report.pdf

  deploy:
    if: github.ref == 'refs/heads/report'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
