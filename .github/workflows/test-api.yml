name: Test API

on:
  push:
    branches:
      - main
      - develop
      - feat/**
  pull_request:

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    # The security suites skip themselves when these are unset, so without
    # real services CI reports green without asserting a single invariant.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secretshare
          POSTGRES_PASSWORD: secretshare
          POSTGRES_DB: secretshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretshare -d secretshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+asyncpg://secretshare:secretshare@127.0.0.1:5432/secretshare"
      TEST_DATABASE_URL: "postgresql+asyncpg://secretshare:secretshare@127.0.0.1:5432/secretshare"
      TEST_REDIS_URL: "redis://127.0.0.1:6379/0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q --strict-markers --ignore=tests/test_tls.py

      - name: Fail if any security test was skipped
        run: |
          skipped=$(python -m pytest tests/security -q --no-header 2>&1 \
            | grep -oE '[0-9]+ skipped' || true)
          if [ -n "$skipped" ]; then
            echo "::error::Security tests were skipped: $skipped"
            echo "They assert the invariants in CLAUDE.md §2 and must always run."
            exit 1
          fi

  oauth-integration:
    name: Run OAuth live integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare environment
        run: |
          docker network create traefik-net || true
          POSTGRES_PWD=$(openssl rand -hex 16)
          KC_PWD=$(openssl rand -hex 16)
          cat <<EOF > .env
          POSTGRES_USER=secretshare
          POSTGRES_PASSWORD=${POSTGRES_PWD}
          POSTGRES_DB=secretshare
          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=${KC_PWD}
          KEYCLOAK_DB=keycloak
          KEYCLOAK_REALM=secretshare
          KEYCLOAK_CLIENT_ID=secretshare-api
          EOF

      - name: Start Docker services
        run: |
          docker compose up -d --wait db keycloak traefik web api

      - name: Verify path-based routing & health
        run: |
          bash .github/scripts/test_web_routing.sh "http://localhost:80" false
          bash .github/scripts/test_api_docs.sh "http://localhost:80"
          curl -s -f http://localhost:80/keycloak/realms/secretshare | grep -q '"realm":"secretshare"'
          echo "=== All path routing checks passed! ==="

      - name: Run OAuth integration tests
        env:
          KEYCLOAK_URL: http://localhost:80/keycloak
          KEYCLOAK_REALM: secretshare
          KEYCLOAK_CLIENT_ID: secretshare-api
          TEST_USER_USERNAME: testuser
          TEST_USER_PASSWORD: testpassword123
          TEST_USER_EMAIL: test@example.com
          API_BASE_URL: http://localhost:80/api
          REQUIRE_KEYCLOAK: "1"
        working-directory: api
        run: |
          python -m pytest -v -m integration tests/test_oauth_integration.py

      - name: Output container logs on failure
        if: failure()
        run: |
          docker compose logs keycloak
          docker compose logs db
          docker compose logs api
          docker compose logs web

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v
