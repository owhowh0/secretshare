<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecretShare</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    // Normalize path to have trailing slash on /pr-<N> so relative paths work cleanly
    if (window.location.pathname.match(/^\/pr-\d+$/)) {
      window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { font-size: 1.4rem; font-weight: 700; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; }

    section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: inherit;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }

    textarea:focus, input:focus { outline: 2px solid #4f8ef7; border-color: transparent; }

    button {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: opacity 0.15s;
      background: #4f8ef7;
      color: #fff;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled) { opacity: 0.88; }

    .error {
      font-size: 0.85rem;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      background: #2d1f1f;
      border: 1px solid #4a2e2e;
      color: #c87e7e;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
    }

    hr { border: none; border-top: 1px solid #222; }

    .muted { font-size: 0.85rem; color: #888; font-family: monospace; }
  </style>
</head>
<body>
<main>

  <header>
    <h1>SecretShare</h1>
    <div id="auth-section">
      <button id="login-btn">Login with Keycloak</button>
      <div id="user-info" style="display: none; align-items: center; gap: 0.75rem;">
        <span id="username" class="muted"></span>
        <button id="logout-btn" style="background: #333; font-size: 0.85rem; padding: 0.4rem 0.8rem;">Logout</button>
      </div>
    </div>
  </header>

  <hr>

  <section>
    <h2>Create secret</h2>
    <textarea id="secret" rows="5" placeholder="Type your secret here…"></textarea>
    <button id="create-btn">Create</button>
    <p id="create-result" hidden class="muted"></p>
    <p id="create-error" hidden class="error"></p>
  </section>

  <hr>

  <section>
    <h2>Retrieve secret</h2>
    <input type="text" id="payload-id" placeholder="Payload ID">
    <button id="retrieve-btn">Retrieve</button>
    <pre id="retrieve-result" hidden></pre>
    <p id="retrieve-error" hidden class="error"></p>
  </section>

</main>
<script>
  (function() {
    const match = window.location.pathname.match(/^(\/pr-\d+)/);
    const basePath = match ? match[1] : '';
    const scriptPath = basePath + '/app.js';
    const s = document.createElement('script');
    s.src = scriptPath;
    s.defer = true;
    s.onerror = function() {
      console.error('Failed to load application script from ' + scriptPath);
    };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
