services:
  # Generates CA + postgres + redis TLS certificates into the tls-certs volume.
  # Runs once per volume lifetime; subsequent starts are no-ops.
  tls-init:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null 2>&1
        sh /scripts/generate.sh
    volumes:
      - tls-certs:/certs
      - ./tls:/scripts:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ""
        NEXT_PUBLIC_API_BASE: "/api"
    environment:
      - NEXT_PUBLIC_BASE_PATH=
      - NEXT_PUBLIC_API_BASE=/api
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://${PR_HOSTNAME:-pr-${PR_NUMBER}.staging-server}/api/auth
      - AUTH_KEYCLOAK_ID=secretshare-api
      - AUTH_KEYCLOAK_SECRET=
      - AUTH_KEYCLOAK_ISSUER=https://${PR_HOSTNAME:-pr-${PR_NUMBER}.staging-server}/keycloak/realms/secretshare
      - KEYCLOAK_ISSUER=https://${PR_HOSTNAME:-pr-${PR_NUMBER}.staging-server}/keycloak/realms/secretshare
      - KEYCLOAK_CLIENT_ID=secretshare-api
    extra_hosts:
      - "staging-server:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "traefik.enable=true"
      # Main web router on PR subdomain
      - "traefik.http.routers.pr-${PR_NUMBER}-web.rule=Host(`${PR_HOSTNAME}`) || Host(`pr-${PR_NUMBER}.staging-server`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.priority=10"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.middlewares=pr-${PR_NUMBER}-proto-header"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.service=pr-${PR_NUMBER}-web"

      # NextAuth router: route /api/auth to web instead of api (priority 150 > api 100)
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.rule=(Host(`${PR_HOSTNAME}`) || Host(`pr-${PR_NUMBER}.staging-server`)) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.priority=150"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.middlewares=pr-${PR_NUMBER}-proto-header"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.service=pr-${PR_NUMBER}-web"

      - "traefik.http.middlewares.pr-${PR_NUMBER}-proto-header.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-proto-header.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.services.pr-${PR_NUMBER}-web.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-secretshare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-secretshare}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:5432/${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      - REDIS_URL=${REDIS_URL:-rediss://${REDIS_HOST:-redis}:6379/0}
      - TLS_CA_CERT=/certs/ca.crt
      - PR_NUMBER=${PR_NUMBER}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/keycloak}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-secretshare}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-secretshare-api}
      - API_ROOT_PATH=/api
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    volumes:
      - tls-certs:/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.rule=(Host(`${PR_HOSTNAME}`) || Host(`pr-${PR_NUMBER}.staging-server`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.priority=100"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.middlewares=pr-${PR_NUMBER}-proto-header,pr-${PR_NUMBER}-api-strip"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.pr-${PR_NUMBER}-api.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik-net

  db:
    image: postgres:16-alpine
    # Custom entrypoint: copies the root-owned key to /tmp with postgres
    # ownership so PostgreSQL can read it, then starts the original entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        install -m 600 -o postgres /certs/postgres.key /tmp/postgres.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/certs/postgres.crt \
          -c ssl_key_file=/tmp/postgres.key \
          -c ssl_ca_file=/certs/ca.crt
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak_pr_${PR_NUMBER}}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    volumes:
      - pr-pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - tls-certs:/certs:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "PGSSLMODE=require pg_isready -U ${POSTGRES_USER:-secretshare} -d ${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    # Custom entrypoint: copies the root-owned key to /tmp with redis ownership,
    # then starts redis-server with TLS on port 6379 and the plain port disabled.
    entrypoint:
      - /bin/sh
      - -c
      - |
        install -m 600 -o redis /certs/redis.key /tmp/redis.key
        exec redis-server \
          --tls-port 6379 --port 0 \
          --tls-cert-file /certs/redis.crt \
          --tls-key-file /tmp/redis.key \
          --save "" --appendonly no
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    volumes:
      - tls-certs:/certs:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "--tls", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak_pr_${PR_NUMBER}}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: require
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tls-certs:/certs:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Ensuring Keycloak database $${KEYCLOAK_DB} exists..."
        psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" <<-EOSQL
          SELECT format('CREATE DATABASE %I', '$${KEYCLOAK_DB}')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$${KEYCLOAK_DB}')\gexec
          GRANT ALL PRIVILEGES ON DATABASE "$${KEYCLOAK_DB}" TO "$${POSTGRES_USER}";
        EOSQL
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_PATH:-/keycloak}
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_PORT: "443"
      KC_HOSTNAME_URL: "https://${PR_HOSTNAME:-pr-${PR_NUMBER}.staging-server}/keycloak"
      KC_HOSTNAME_ADMIN_URL: "https://${PR_HOSTNAME:-pr-${PR_NUMBER}.staging-server}/keycloak"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-db}:5432/${KEYCLOAK_DB:-keycloak_pr_${PR_NUMBER}}?ssl=true&sslmode=require
      KC_DB_USERNAME: ${POSTGRES_USER:-secretshare}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.rule=(Host(`${PR_HOSTNAME}`) || Host(`pr-${PR_NUMBER}.staging-server`)) && PathPrefix(`${KEYCLOAK_PATH:-/keycloak}`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.priority=200"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.middlewares=pr-${PR_NUMBER}-proto-header"
      - "traefik.http.services.pr-${PR_NUMBER}-keycloak.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik-net

  tailscale:
    image: tailscale/tailscale:latest
    hostname: pr-${PR_NUMBER}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - pr-ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - default
      - traefik-net

volumes:
  pr-pgdata:
  pr-ts-state:
  tls-certs:

networks:
  default:
  traefik-net:
    external: true
