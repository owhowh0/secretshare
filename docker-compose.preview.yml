services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: "/pr-${PR_NUMBER}"
        NEXT_PUBLIC_API_BASE: "/pr-${PR_NUMBER}/api"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://staging-server/pr-${PR_NUMBER}/api/auth
      - AUTH_KEYCLOAK_ID=secretshare-api
      - AUTH_KEYCLOAK_SECRET=
      - AUTH_KEYCLOAK_ISSUER=http://staging-server/pr-${PR_NUMBER}/keycloak/realms/secretshare
      - KEYCLOAK_ISSUER=http://staging-server/pr-${PR_NUMBER}/keycloak/realms/secretshare
      - KEYCLOAK_CLIENT_ID=secretshare-api
    extra_hosts:
      - "staging-server:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "traefik.enable=true"
      # Redirect /pr-N to /pr-N/
      - "traefik.http.routers.pr-${PR_NUMBER}-web-redirect.rule=Path(`/pr-${PR_NUMBER}`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-redirect.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-redirect.priority=20"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-redirect.service=pr-${PR_NUMBER}-web"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-redirect.middlewares=pr-${PR_NUMBER}-redirect-slash"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-redirect-slash.redirectregex.regex=^.*(/pr-${PR_NUMBER})$$"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-redirect-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-redirect-slash.redirectregex.permanent=true"

      # Main web router
      - "traefik.http.routers.pr-${PR_NUMBER}-web.rule=PathPrefix(`/pr-${PR_NUMBER}`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.priority=10"
      - "traefik.http.routers.pr-${PR_NUMBER}-web.service=pr-${PR_NUMBER}-web"

      # NextAuth router: route /pr-N/api/auth to web instead of api (priority 150 > api 100)
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.rule=PathPrefix(`/pr-${PR_NUMBER}/api/auth`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.priority=150"
      - "traefik.http.routers.pr-${PR_NUMBER}-web-auth.service=pr-${PR_NUMBER}-web"

      - "traefik.http.services.pr-${PR_NUMBER}-web.loadbalancer.server.port=3000"
    networks:
      - default
      - traefik-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-secretshare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-secretshare}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:5432/${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      - REDIS_URL=${REDIS_URL:-redis://${REDIS_HOST:-redis}:6379/0}
      - PR_NUMBER=${PR_NUMBER}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/pr-${PR_NUMBER}/keycloak}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-secretshare}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-secretshare-api}
      - API_ROOT_PATH=/pr-${PR_NUMBER}/api
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.rule=PathPrefix(`/pr-${PR_NUMBER}/api`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.priority=100"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.middlewares=pr-${PR_NUMBER}-api-strip"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-api-strip.stripprefix.prefixes=/pr-${PR_NUMBER}/api"
      - "traefik.http.services.pr-${PR_NUMBER}-api.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak_pr_${PR_NUMBER}}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    volumes:
      - pr-pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secretshare} -d ${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secretshare_pr_${PR_NUMBER}}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak_pr_${PR_NUMBER}}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Ensuring Keycloak database $${KEYCLOAK_DB} exists..."
        psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" <<-EOSQL
          SELECT format('CREATE DATABASE %I', '$${KEYCLOAK_DB}')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$${KEYCLOAK_DB}')\gexec
          GRANT ALL PRIVILEGES ON DATABASE "$${KEYCLOAK_DB}" TO "$${POSTGRES_USER}";
        EOSQL
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_PATH:-/pr-${PR_NUMBER}/keycloak}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-db}:5432/${KEYCLOAK_DB:-keycloak_pr_${PR_NUMBER}}
      KC_DB_USERNAME: ${POSTGRES_USER:-secretshare}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.rule=PathPrefix(`${KEYCLOAK_PATH:-/pr-${PR_NUMBER}/keycloak}`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.priority=200"
      - "traefik.http.services.pr-${PR_NUMBER}-keycloak.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik-net

volumes:
  pr-pgdata:

networks:
  default:
  traefik-net:
    external: true
