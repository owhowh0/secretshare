services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=secretshare
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=secretshare_pr_${PR_NUMBER}
      - DATABASE_URL=postgresql+asyncpg://secretshare:${POSTGRES_PASSWORD}@db:5432/secretshare_pr_${PR_NUMBER}
      - REDIS_URL=redis://redis:6379/0
      - PR_NUMBER=${PR_NUMBER}
      - KEYCLOAK_URL=http://keycloak:8080/pr-${PR_NUMBER}/keycloak
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.rule=PathPrefix(`/pr-${PR_NUMBER}`) || Host(`pr-${PR_NUMBER}.api.staging-server`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.entrypoints=web"
      - "traefik.http.routers.pr-${PR_NUMBER}-api.middlewares=pr-${PR_NUMBER}-strip"
      - "traefik.http.middlewares.pr-${PR_NUMBER}-strip.stripprefix.prefixes=/pr-${PR_NUMBER}"
      - "traefik.http.services.pr-${PR_NUMBER}-api.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secretshare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: secretshare_pr_${PR_NUMBER}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    volumes:
      - pr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretshare -d secretshare_pr_${PR_NUMBER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /pr-${PR_NUMBER}/keycloak
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/pr-${PR_NUMBER}/keycloak/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.rule=PathPrefix(`/pr-${PR_NUMBER}/keycloak`)"
      - "traefik.http.routers.pr-${PR_NUMBER}-keycloak.entrypoints=web"
      - "traefik.http.services.pr-${PR_NUMBER}-keycloak.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik-net

volumes:
  pr-pgdata:

networks:
  default:
  traefik-net:
    external: true
