services:
  traefik:
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-net

  # Generates CA + postgres + redis TLS certificates into the tls-certs volume.
  # Runs once per volume lifetime; subsequent starts are no-ops.
  tls-init:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null 2>&1
        sh /scripts/generate.sh
    volumes:
      - tls-certs:/certs
      - ./tls:/scripts:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ""
        NEXT_PUBLIC_API_BASE: "/api"
    environment:
      - NEXT_PUBLIC_BASE_PATH=
      - NEXT_PUBLIC_API_BASE=/api
      - AUTH_SECRET=${AUTH_SECRET:-default_dev_auth_secret_must_be_32_characters}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:${TRAEFIK_WEB_PORT:-80}/api/auth
      - AUTH_KEYCLOAK_ID=secretshare-api
      - AUTH_KEYCLOAK_SECRET=
      - AUTH_KEYCLOAK_ISSUER=http://localhost:${TRAEFIK_WEB_PORT:-80}/keycloak/realms/secretshare
      - KEYCLOAK_ISSUER=http://localhost:${TRAEFIK_WEB_PORT:-80}/keycloak/realms/secretshare
      - KEYCLOAK_CLIENT_ID=secretshare-api
    extra_hosts:
      - "localhost:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=10"

      # NextAuth router: route /api/auth to web instead of api (priority 150 > api 100)
      - "traefik.http.routers.web-auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.web-auth.entrypoints=web"
      - "traefik.http.routers.web-auth.priority=150"
      - "traefik.http.routers.web-auth.service=web"

      - "traefik.http.services.web.loadbalancer.server.port=3000"
    networks:
      - traefik-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-secretshare}
      - POSTGRES_DB=${POSTGRES_DB:-secretshare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-secretshare}:${POSTGRES_PASSWORD}@${DB_HOST:-db}:5432/${POSTGRES_DB:-secretshare}
      - REDIS_URL=${REDIS_URL:-rediss://${REDIS_HOST:-redis}:6379/0}
      - TLS_CA_CERT=/certs/ca.crt
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080${KEYCLOAK_PATH:-/keycloak}}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-secretshare}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-secretshare-api}
      - API_ROOT_PATH=/api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tls-init:
        condition: service_completed_successfully
    volumes:
      - tls-certs:/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=api-strip"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik-net

  db:
    image: postgres:16-alpine
    # Custom entrypoint: copies the root-owned key to /tmp with postgres
    # ownership so PostgreSQL can read it, then starts the original entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        install -m 600 -o postgres /certs/postgres.key /tmp/postgres.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/certs/postgres.crt \
          -c ssl_key_file=/tmp/postgres.key \
          -c ssl_ca_file=/certs/ca.crt
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secretshare}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - tls-certs:/certs:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "PGSSLMODE=require pg_isready -U ${POSTGRES_USER:-secretshare} -d ${POSTGRES_DB:-secretshare}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    # Custom entrypoint: copies the root-owned key to /tmp with redis ownership,
    # then starts redis-server with TLS on port 6379 and the plain port disabled.
    entrypoint:
      - /bin/sh
      - -c
      - |
        install -m 600 -o redis /certs/redis.key /tmp/redis.key
        exec redis-server \
          --tls-port 6379 --port 0 \
          --tls-cert-file /certs/redis.crt \
          --tls-key-file /tmp/redis.key \
          --tls-ca-cert-file /certs/ca.crt \
          --tls-auth-clients no \
          --save "" --appendonly no
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - tls-certs:/certs:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "redis", "--tls", "--cacert", "/certs/ca.crt", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  keycloak-db-init:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secretshare}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: require
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tls-certs:/certs:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Ensuring Keycloak database $${KEYCLOAK_DB} exists..."
        psql -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" <<-EOSQL
          SELECT format('CREATE DATABASE %I', '$${KEYCLOAK_DB}')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$${KEYCLOAK_DB}')\gexec
          GRANT ALL PRIVILEGES ON DATABASE "$${KEYCLOAK_DB}" TO "$${POSTGRES_USER}";
        EOSQL
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: ${KEYCLOAK_PATH:-/keycloak}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-db}:5432/${KEYCLOAK_DB:-keycloak}?ssl=true&sslmode=require
      KC_DB_USERNAME: ${POSTGRES_USER:-secretshare}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      db:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`${KEYCLOAK_PATH:-/keycloak}`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.priority=200"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik-net

volumes:
  pgdata:
  keycloak-data:
  tls-certs:

networks:
  traefik-net:
    name: traefik-net
    external: true
